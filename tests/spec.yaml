meta:
  model: QUEST-30B-RL
  arch: qwen3moe
  ship_quant: Q5_K_M
  max_tokens: 4096            # reasoning model burns tokens in <think>; <4096 => empty replies
  reasoning_suffix: "\n\nThink step by step, then end your reply with a line in exactly this form:\nANSWER: <your final answer>"

metadata:
  - {key: general.architecture,                expected: qwen3moe, type: str}
  - {key: qwen3moe.block_count,                expected: 48,       type: int}
  - {key: qwen3moe.expert_count,               expected: 128,      type: int}
  - {key: qwen3moe.expert_used_count,          expected: 8,        type: int}
  - {key: qwen3moe.attention.head_count,       expected: 32,       type: int}
  - {key: qwen3moe.attention.head_count_kv,    expected: 4,        type: int}
  - {key: qwen3moe.context_length,             expected: 262144,   type: int}
  - {key: qwen3moe.embedding_length,           expected: 2048,     type: int}
  - {key: qwen3moe.feed_forward_length,        expected: 6144,     type: int}
  - {key: qwen3moe.expert_feed_forward_length, expected: 768,      type: int}
  - {key: qwen3moe.rope.freq_base,             expected: 1.0e7,    type: float, rel_tol: 1.0e-6}

tools:
  calculator:
    type: function
    function:
      name: calculator
      description: Evaluate an arithmetic expression.
      parameters: {type: object, properties: {expression: {type: string, description: "e.g. '17 * 23'"}}, required: [expression]}
  web_search:
    type: function
    function:
      name: web_search
      description: Search the web for current information.
      parameters: {type: object, properties: {query: {type: string}}, required: [query]}
  get_weather:
    type: function
    function:
      name: get_weather
      description: Get the current weather for a location.
      parameters: {type: object, properties: {location: {type: string}, unit: {type: string, enum: [celsius, fahrenheit]}}, required: [location, unit]}
  create_event:
    type: function
    function:
      name: create_event
      description: Create a calendar event.
      parameters: {type: object, properties: {title: {type: string}, date: {type: string, description: YYYY-MM-DD}, attendees: {type: array, items: {type: string}}}, required: [title, date, attendees]}
  create_order:
    type: function
    function:
      name: create_order
      description: Place a purchase order.
      parameters:
        type: object
        properties:
          priority: {type: string, enum: [low, normal, high]}
          items: {type: array, items: {type: object, properties: {sku: {type: string}, qty: {type: integer}}, required: [sku, qty]}}
          shipping: {type: object, properties: {method: {type: string, enum: [standard, express]}, address: {type: string}}, required: [method, address]}
        required: [priority, items, shipping]

tool_probes:
  - id: calc_route
    tools: [calculator, web_search]
    prompt: "Use a tool to compute 17 multiplied by 23."
    expect_fn: calculator
    min_calls: 1
    arg_checks: [{field: expression, contains_all: ["17", "23"]}]
    why: "picks calculator (not search) and passes both operands"
  - id: search_route
    tools: [calculator, web_search]
    prompt: "Find the current population of Tokyo using a tool."
    expect_fn: web_search
    min_calls: 1
    arg_checks: [{field: query, contains_all: [tokyo, pop]}]
    why: "picks web_search and includes the subject in the query"
  - id: weather_enum
    tools: [get_weather]
    prompt: "What's the weather in Paris right now, in celsius? Use the weather tool."
    expect_fn: get_weather
    min_calls: 1
    arg_checks: [{field: location, contains_all: [paris]}, {field: unit, equals: celsius}]
    why: "fills location AND the enum-constrained unit correctly"
  - id: nested_json
    tools: [create_event]
    prompt: "Schedule a calendar event titled 'Q3 Review' on 2026-07-01 with attendees alice and bob."
    expect_fn: create_event
    min_calls: 1
    arg_checks: [{field: title, contains_all: ["q3 review"]}, {field: date, contains_all: ["2026-07-01"]}, {field: attendees, type: array}, {field: attendees, min_len: 2}]
    why: "emits nested/array JSON args without corruption"
  - id: calc_vs_search2
    tools: [calculator, web_search]
    prompt: "I need the value of 144 divided by 12. Use the appropriate tool."
    expect_fn: calculator
    min_calls: 1
    arg_checks: [{field: expression, contains_all: ["144", "12"]}]
    why: "routes a pure-math request to calculator, not search"
  - id: nested_enum
    tools: [create_order]
    prompt: "Place a HIGH priority order: 2 units of SKU A100 and 3 units of SKU B200, shipped express to '5 Main St'. Use the tool."
    expect_fn: create_order
    min_calls: 1
    arg_checks:
      - {field: priority, equals: high}
      - {field: items, type: array}
      - {field: items, min_len: 2}
      - {field: items, items_have_keys: [sku, qty]}
      - {field: shipping, type: object}
      - {field: shipping.method, equals: express}
      - {field: shipping.address, contains_all: [main]}
    why: "deeply-nested JSON (array-of-objects + nested object + 2 enums) without corruption"
  - id: abstain
    tools: [calculator, web_search, get_weather, create_event]
    prompt: "Translate the phrase 'good morning' into French."
    expect_fn: __none__
    min_calls: 1
    arg_checks: []
    why: "no offered tool fits -> answers directly with NO tool call (catches over-calling)"
  - id: search_then_calc
    tools: [web_search, calculator]
    prompt: "What is the current population of Tokyo divided by 1000? Use tools."
    expect_fn: web_search
    min_calls: 1
    arg_checks: [{field: query, contains_all: [tokyo, pop]}]
    why: "research before computing -> first call is web_search, not calculator on a guessed number"
  - id: par_weather
    tools: [get_weather]
    prompt: "Compare the weather in Paris and Tokyo right now, both in celsius. Use the weather tool."
    expect_fn: get_weather
    min_calls: 2
    arg_checks: [{field: location, contains_any: [paris, tokyo]}, {field: unit, equals: celsius}]
    why: "TWO well-formed parallel get_weather calls (min_calls 2 required)"

reason_probes:
  - {id: apples,    expect: "120", prompt: "A store had 240 apples. It sold 1/3 on Monday, then 1/4 of the remaining on Tuesday. How many are left?"}
  - {id: xy,        expect: "21",  prompt: "Given x + y = 10 and x - y = 4, what is x times y?"}
  - {id: strings,   expect: "24",  prompt: "How many distinct 3-letter strings can be formed from {A,B,C,D} with no repeated letter?"}
  - {id: shirt,     expect: "80",  prompt: "A shirt costs $80, increased by 25%, then decreased by 20%. Final price in dollars?"}
  - {id: taps,      expect: "4",   prompt: "One tap fills a tank in 6 hours, another in 12 hours. Together, how many hours to fill it?"}
  - {id: avgspeed,  expect: "60",  prompt: "A car goes 150 km at 50 km/h, then 150 km at 75 km/h. Average speed over 300 km, in km/h?"}
  - {id: snail,     expect: "8",   prompt: "A snail climbs 3 m up a well by day and slips 2 m back each night. The well is 10 m deep. On which day does it first reach the top?"}
  - {id: div3or5,   expect: "47",  prompt: "How many integers from 1 to 100 inclusive are divisible by 3 or by 5?"}
  - {id: overtime,  expect: "735", prompt: "A worker earns $15/h for the first 40 hours and 1.5x for overtime. They worked 46 hours. Total pay in dollars?"}
  - {id: fatherson, expect: "12",  prompt: "A father is 3x as old as his son. In 12 years he'll be twice as old as the son then. How old is the son now?"}

thresholds:
  sanity:   {bf16_tool_min: 8, bf16_think_min: 10}     # if BF16 below these the RIG is broken, not the model
  tool:     {nt: 9,  key_drop_max: 1, agree_min: 8}     # agree_min == nt-1
  reason:   {nr: 10, key_drop_max: 2, agree_min: 8}     # agree_min == nr-2
  think:    {ref_required: 10, cand_must_equal_ref: true}
  hard_fails: {critical_probes: [nested_enum, abstain, par_weather]}
  ppl:      {max: 8.5, anchor: 7.19}                    # Q5 wikitext gross-breakage guard
  # Conservative same-family floor: the 35B/256E A3B reference peaks pp512 1154.6 / tg128 79.9 on the B70.
  # QUEST-30B/128E Q5_K_M clears it comfortably (measured pp512 ~1380 / tg128 ~90-110), so this floor
  # catches gross speed regressions without false NO-SHIPs. Re-derive from a QUEST bench for a tighter floor.
  perf:     {pp512_baseline: 1154.6, tg128_baseline: 79.9, tolerance: 0.05}   # -> pp512_min 1096.9, tg128_min 75.9
